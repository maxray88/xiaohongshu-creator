<!DOCTYPE html>
<html lang="zh-CN" data-theme="暮色琥珀">
<head>
<meta charset="UTF-8">
<title>被看见努力才有安全感</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g0:#FFF7ED;--g1:#FFEDD5;--g2:#FDBA74;--ac:#EA580C;--tx:#431407;--mu:#9CA3AF;}
html[data-theme="暮色琥珀"]{--g0:#FFF7ED;--g1:#FFEDD5;--g2:#FDBA74;--ac:#EA580C;--tx:#431407;--mu:#9CA3AF;}
html[data-theme="晨雾薄荷"]{--g0:#ECFDF5;--g1:#D1FAE5;--g2:#6EE7B7;--ac:#059669;--tx:#064E3B;--mu:#6B7280;}
html[data-theme="雾蓝海湾"]{--g0:#EFF6FF;--g1:#DBEAFE;--g2:#93C5FD;--ac:#2563EB;--tx:#1E3A8A;--mu:#64748B;}
html[data-theme="玫瑰暮云"]{--g0:#FFF1F2;--g1:#FFE4E6;--g2:#FECDD3;--ac:#E11D48;--tx:#4C0519;--mu:#9CA3AF;}
html[data-theme="森林晨光"]{--g0:#F0FDF4;--g1:#DCFCE7;--g2:#86EFAC;--ac:#16A34A;--tx:#052E16;--mu:#6B7280;}
html[data-theme="海盐汽水"]{--g0:#0D3A57;--g1:#EAF7FF;--g2:#5FB6DE;--ac:#FFD166;--tx:#EAF7FF;--mu:#B8ECD9;}
html[data-theme="雪松深夜"]{--g0:#0F172A;--g1:#1E293B;--g2:#334155;--ac:#38BDF8;--tx:#F1F5F9;--mu:#94A3B8;}
html[data-theme="麦田晚风"]{--g0:#FFFBEB;--g1:#FEF3C7;--g2:#FCD34D;--ac:#D97706;--tx:#451A03;--mu:#9CA3AF;}
html[data-theme="莓果初雪"]{--g0:#FFF1F5;--g1:#FFE4EC;--g2:#F9A8D4;--ac:#EC4899;--tx:#4A0A2A;--mu:#9CA3AF;}
html[data-theme="苔藓墨绿"]{--g0:#022C22;--g1:#064E3B;--g2:#10B981;--ac:#34D399;--tx:#ECFDF5;--mu:#6EE7B7;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Noto Sans SC","PingFang SC",sans-serif;}
.card{width:1080px;height:1440px;display:flex;overflow:hidden;background:var(--g0);color:var(--tx);}
.rail{width:176px;flex:none;background:var(--g1);display:flex;flex-direction:column;align-items:center;padding:56px 0 48px;}
.cub{width:36px;height:36px;background:var(--ac);border-radius:10px;flex:none;}
.slotname{writing-mode:vertical-rl;font-size:27px;font-weight:700;color:var(--tx);letter-spacing:10px;margin-top:36px;}
.pagenum{margin-top:auto;font-size:24px;font-weight:700;color:var(--ac);}
.main{flex:1;display:flex;flex-direction:column;padding:60px 52px 44px;min-width:0;}
.topline{font-size:24px;font-weight:700;color:var(--ac);line-height:1.5;}
h1{font-weight:800;color:var(--tx);letter-spacing:-0.01em;}
.lead{font-size:27px;font-weight:500;line-height:1.65;color:var(--tx);}
.body{font-size:26px;font-weight:400;line-height:1.7;color:var(--tx);}
.quote{font-size:33px;font-weight:700;line-height:1.55;color:var(--tx);}
.closing{font-size:27px;font-weight:700;line-height:1.6;color:var(--ac);}
.signoff{font-size:26px;font-weight:700;color:var(--ac);}
.well{background:#201a14;padding:12px;border-radius:24px;}
.well img{display:block;width:100%;object-fit:cover;border-radius:12px;}
.steps{display:flex;flex-direction:column;gap:14px;}
.step{display:flex;gap:16px;align-items:flex-start;background:var(--g1);border-radius:16px;padding:20px 22px;}
.chip{flex:none;width:44px;height:44px;border-radius:12px;background:var(--ac);color:var(--g0);font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.step p{font-size:25px;line-height:1.6;color:var(--tx);font-weight:500;}
.btn{display:block;width:100%;background:var(--tx);color:var(--g0);font-family:inherit;font-size:30px;font-weight:700;padding:30px 0;text-align:center;border-radius:16px;border:none;}
.footer{margin-top:auto;padding-top:20px;font-size:20px;font-weight:500;color:var(--tx);}
.credit{display:block;font-size:17px;margin-top:6px;opacity:0.8;}
</style>
</head>
<body>
<div class="card">
<div class="rail" data-od-id="spine-rail">
<div class="cub" data-od-id="spine-cub"></div>
<div class="slotname" data-od-id="spine-slot">观点</div>
<div class="pagenum" data-od-id="spine-page">3 / 6</div>
</div>
<div class="main">
<h1 data-od-id="insight-title" style="font-size:52px;line-height:1.22;">被看见努力才有安全感</h1>
<div style="height:24px;"></div>
<p class="quote" data-od-id="insight-quote">心理学里有个说法，叫表现性忠诚。当安全感绑在被看见努力上，离开就等于冒险。</p>
<div style="height:24px;"></div>
<div class="well" data-od-id="insight-photo"><img src="assets/stamp-orange.jpg" alt="橙色邮票档案照" style="height:760px;object-position:50% 30%;"></div>
<div style="height:24px;"></div>
<p class="body" data-od-id="insight-p2">可领导真的在看你几点走吗？大多时候人家只是在忙自己的事。</p>
<div style="height:14px;"></div>
<p class="closing" data-od-id="insight-closing">你脑补的那些评判多半是心里的回声。</p>
<div class="footer" data-od-id="card-footer">
<span>情绪树洞 · 母版样张</span>
<span class="credit">橙色邮票档案实拍</span>
</div>
</div>
</div>
</body>
</html>
