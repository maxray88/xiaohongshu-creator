<!DOCTYPE html>
<html lang="zh-CN" data-theme="暮色琥珀">
<head>
<meta charset="UTF-8">
<title>情绪树洞 下班了，你却不敢走</title>
<style>
:root{--g0:#FFF7ED;--g1:#FFEDD5;--g2:#FDBA74;--ac:#EA580C;--tx:#431407;--mu:#9CA3AF;}
html[data-theme="暮色琥珀"]{--g0:#FFF7ED;--g1:#FFEDD5;--g2:#FDBA74;--ac:#EA580C;--tx:#431407;--mu:#9CA3AF;}
html[data-theme="晨雾薄荷"]{--g0:#ECFDF5;--g1:#D1FAE5;--g2:#6EE7B7;--ac:#059669;--tx:#064E3B;--mu:#6B7280;}
html[data-theme="雾蓝海湾"]{--g0:#EFF6FF;--g1:#DBEAFE;--g2:#93C5FD;--ac:#2563EB;--tx:#1E3A8A;--mu:#64748B;}
html[data-theme="玫瑰暮云"]{--g0:#FFF1F2;--g1:#FFE4E6;--g2:#FECDD3;--ac:#E11D48;--tx:#4C0519;--mu:#9CA3AF;}
html[data-theme="森林晨光"]{--g0:#F0FDF4;--g1:#DCFCE7;--g2:#86EFAC;--ac:#16A34A;--tx:#052E16;--mu:#6B7280;}
html[data-theme="海盐汽水"]{--g0:#0D3A57;--g1:#EAF7FF;--g2:#5FB6DE;--ac:#FFD166;--tx:#EAF7FF;--mu:#B8ECD9;}
html[data-theme="雪松深夜"]{--g0:#0F172A;--g1:#1E293B;--g2:#334155;--ac:#38BDF8;--tx:#F1F5F9;--mu:#94A3B8;}
html[data-theme="麦田晚风"]{--g0:#FFFBEB;--g1:#FEF3C7;--g2:#FCD34D;--ac:#D97706;--tx:#451A03;--mu:#9CA3AF;}
html[data-theme="莓果初雪"]{--g0:#FFF1F5;--g1:#FFE4EC;--g2:#F9A8D4;--ac:#EC4899;--tx:#4A0A2A;--mu:#9CA3AF;}
html[data-theme="苔藓墨绿"]{--g0:#022C22;--g1:#064E3B;--g2:#10B981;--ac:#34D399;--tx:#ECFDF5;--mu:#6EE7B7;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Noto Sans SC","PingFang SC",sans-serif;}
.card{width:1080px;height:1440px;position:relative;overflow:hidden;background:var(--tx);}
.paper{position:absolute;left:48px;top:48px;width:984px;height:1344px;background:var(--g0);padding:48px;display:flex;flex-direction:column;}
.top{display:flex;align-items:center;justify-content:space-between;}
.pill{background:var(--ac);color:var(--g0);font-size:18px;font-weight:600;letter-spacing:0.08em;padding:14px 28px;}
.night{font-size:20px;color:var(--tx);}
h1.cover{font-size:56px;font-weight:800;line-height:1.15;color:var(--tx);}
h2.cardtitle{font-size:36px;font-weight:700;line-height:1.3;color:var(--tx);}
p.body{font-size:26px;font-weight:400;line-height:1.7;color:var(--tx);}
p.cap{font-size:20px;line-height:1.5;color:var(--tx);}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;}
.footword{font-size:20px;color:var(--tx);}
.f0{fill:var(--g0);}
.f1{fill:var(--g1);}
.f2{fill:var(--g2);}
.fac{fill:var(--ac);}
.ftx{fill:var(--tx);}
.sring{stroke:var(--mu);fill:none;}
.svgt{font-family:"Noto Sans SC","PingFang SC",sans-serif;}
</style>
</head>
<body>
<div class="card"><div class="paper">
<div class="top" style="justify-content:flex-end;"><span class="night">深夜树洞 第106夜</span></div>
<div style="height:72px;"></div>
<h1 class="cover">下班了，你却不敢走</h1>
<div style="height:24px;"></div>
<p class="body">工位上多坐的那半小时，今晚一次说清楚。</p>
<div style="height:48px;"></div>
<svg width="640" height="420" viewBox="0 0 640 420" style="align-self:center;">
<rect x="60" y="80" width="520" height="280" class="f1"/>
<polygon points="60,88 320,280 580,88 580,80 60,80" class="f2"/>
<rect x="452" y="112" width="96" height="112" class="fac"/>
<rect x="466" y="126" width="68" height="84" class="f0"/>
<text x="500" y="186" text-anchor="middle" font-size="46" font-weight="800" class="fac svgt">树</text>
<circle cx="170" cy="290" r="58" stroke-width="6" class="sring"/>
<circle cx="170" cy="290" r="40" stroke-width="3" class="sring"/>
</svg>
<div style="height:48px;"></div>
<p class="body" style="text-align:center;">今晚十点，树洞开门。</p>
<div style="height:16px;"></div>
<p class="cap" style="text-align:center;">把这封信先收藏好，明晚接着聊。</p>
<div class="foot">
<svg width="132" height="92" viewBox="0 0 132 92"><rect x="6" y="18" width="120" height="68" class="f1"/><polygon points="6,22 66,62 126,22 126,18 6,18" class="f2"/><rect x="88" y="30" width="30" height="36" class="fac"/><rect x="94" y="36" width="18" height="24" class="f0"/></svg>
<span class="footword">情绪树洞 · 第106夜</span>
</div>
</div></div>
</body>
</html>
