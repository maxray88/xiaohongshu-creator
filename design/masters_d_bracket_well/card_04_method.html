<!DOCTYPE html>
<html lang="zh-CN" data-theme="暮色琥珀">
<head>
<meta charset="UTF-8" />
<title>三秒钟，练习准时走</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--g0:#FFF7ED;--g1:#FFEDD5;--g2:#FDBA74;--ac:#EA580C;--tx:#431407;--mu:#9CA3AF;}
html[data-theme="暮色琥珀"]{--g0:#FFF7ED;--g1:#FFEDD5;--g2:#FDBA74;--ac:#EA580C;--tx:#431407;--mu:#9CA3AF;}
html[data-theme="晨雾薄荷"]{--g0:#ECFDF5;--g1:#D1FAE5;--g2:#6EE7B7;--ac:#059669;--tx:#064E3B;--mu:#6B7280;}
html[data-theme="雾蓝海湾"]{--g0:#EFF6FF;--g1:#DBEAFE;--g2:#93C5FD;--ac:#2563EB;--tx:#1E3A8A;--mu:#64748B;}
html[data-theme="玫瑰暮云"]{--g0:#FFF1F2;--g1:#FFE4E6;--g2:#FECDD3;--ac:#E11D48;--tx:#4C0519;--mu:#9CA3AF;}
html[data-theme="森林晨光"]{--g0:#F0FDF4;--g1:#DCFCE7;--g2:#86EFAC;--ac:#16A34A;--tx:#052E16;--mu:#6B7280;}
html[data-theme="海盐汽水"]{--g0:#0D3A57;--g1:#EAF7FF;--g2:#5FB6DE;--ac:#FFD166;--tx:#EAF7FF;--mu:#B8ECD9;}
html[data-theme="雪松深夜"]{--g0:#0F172A;--g1:#1E293B;--g2:#334155;--ac:#38BDF8;--tx:#F1F5F9;--mu:#94A3B8;}
html[data-theme="麦田晚风"]{--g0:#FFFBEB;--g1:#FEF3C7;--g2:#FCD34D;--ac:#D97706;--tx:#451A03;--mu:#9CA3AF;}
html[data-theme="莓果初雪"]{--g0:#FFF1F5;--g1:#FFE4EC;--g2:#F9A8D4;--ac:#EC4899;--tx:#4A0A2A;--mu:#9CA3AF;}
html[data-theme="苔藓墨绿"]{--g0:#022C22;--g1:#064E3B;--g2:#10B981;--ac:#34D399;--tx:#ECFDF5;--mu:#6EE7B7;}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; }
  body {
    width: 1080px; height: 1440px;
    background: var(--g0);
    color: var(--tx);
    font-family: "Noto Sans SC", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
  }
  .card {
    width: 1080px; height: 1440px;
    padding: 72px 64px 64px;
    display: flex; flex-direction: column;
    position: relative;
  }
  .bracket { position: absolute; width: 44px; height: 44px; }
  .bracket.tl { top: 40px; left: 40px; border-top: 2px solid var(--ac); border-left: 2px solid var(--ac); }
  .bracket.tr { top: 40px; right: 40px; border-top: 2px solid var(--ac); border-right: 2px solid var(--ac); }
  .bracket.bl { bottom: 40px; left: 40px; border-bottom: 2px solid var(--ac); border-left: 2px solid var(--ac); }
  .bracket.br { bottom: 40px; right: 40px; border-bottom: 2px solid var(--ac); border-right: 2px solid var(--ac); }
  h1 {
    font-size: 52px; font-weight: 800; line-height: 1.3;
    color: var(--tx); letter-spacing: -0.01em;
  }
  .intro {
    font-size: 28px; font-weight: 500; line-height: 1.6;
    color: var(--tx);
  }
  .step {
    display: flex; gap: 20px; align-items: flex-start;
  }
  .step-num {
    flex-shrink: 0;
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--ac); color: var(--g0);
    font-size: 24px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .step-text {
    font-size: 28px; font-weight: 500; line-height: 1.6;
    color: var(--tx);
  }
  .closing {
    font-size: 26px; font-weight: 600; color: var(--ac);
    line-height: 1.5;
  }
  .photo-well {
    background: #201a14;
    border-radius: 28px;
    overflow: hidden;
    position: relative;
  }
  .photo-well img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .footer {
    margin-top: auto;
    padding-top: 24px;
    display: flex; flex-direction: column; gap: 6px;
    font-size: 18px; color: var(--tx); font-weight: 500;
  }
  .credit { font-size: 16px; color: var(--tx); opacity: 0.8; }
</style>
</head>
<body>
<div class="card" data-od-id="card-method">
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <h1 data-od-id="method-title">三秒钟，练习准时走</h1>

  <p class="intro" data-od-id="method-intro" style="margin: 24px 0 32px;">有点傻但真的管用。今晚就试一次。</p>

    <div class="step" data-od-id="method-step1" style="margin:0 0 24px;">
      <div class="step-num">1</div>
      <div class="step-text">默念三秒我的下班我做主。</div>
    </div>
    <div class="step" data-od-id="method-step2" style="margin:0 0 24px;">
      <div class="step-num">2</div>
      <div class="step-text">直接站起来收拾包。不解释不道歉。</div>
    </div>
    <div class="step" data-od-id="method-step3" style="margin:0 0 32px;">
      <div class="step-num">3</div>
      <div class="step-text">出门别回头，轻快会追上你。</div>
    </div>

  <p class="closing" data-od-id="method-closing" style="margin-bottom: 32px;">世界不会塌掉反而轻快不少。</p>

  <div class="photo-well" data-od-id="method-photo" style="height: 650px;">
    <img src="assets/postcard-back.jpg" alt="明信片背档案照" />
  </div>

  <div class="footer" data-od-id="card-footer">
    <span>情绪树洞 · 母版样张</span>
    <span class="credit">图片来源：assets/postcard-back.jpg（明信片背档案照）</span>
  </div>
</div>
</body>
</html>
