<!DOCTYPE html>
<html lang="zh-CN" data-theme="暮色琥珀">
<head>
<meta charset="UTF-8">
<title>情绪树洞 三秒钟，练习准时走</title>
<style>
:root{--g0:#FFF7ED;--g1:#FFEDD5;--g2:#FDBA74;--ac:#EA580C;--tx:#431407;--mu:#9CA3AF;}
html[data-theme="暮色琥珀"]{--g0:#FFF7ED;--g1:#FFEDD5;--g2:#FDBA74;--ac:#EA580C;--tx:#431407;--mu:#9CA3AF;}
html[data-theme="晨雾薄荷"]{--g0:#ECFDF5;--g1:#D1FAE5;--g2:#6EE7B7;--ac:#059669;--tx:#064E3B;--mu:#6B7280;}
html[data-theme="雾蓝海湾"]{--g0:#EFF6FF;--g1:#DBEAFE;--g2:#93C5FD;--ac:#2563EB;--tx:#1E3A8A;--mu:#64748B;}
html[data-theme="玫瑰暮云"]{--g0:#FFF1F2;--g1:#FFE4E6;--g2:#FECDD3;--ac:#E11D48;--tx:#4C0519;--mu:#9CA3AF;}
html[data-theme="森林晨光"]{--g0:#F0FDF4;--g1:#DCFCE7;--g2:#86EFAC;--ac:#16A34A;--tx:#052E16;--mu:#6B7280;}
html[data-theme="海盐汽水"]{--g0:#0D3A57;--g1:#EAF7FF;--g2:#5FB6DE;--ac:#FFD166;--tx:#EAF7FF;--mu:#B8ECD9;}
html[data-theme="雪松深夜"]{--g0:#0F172A;--g1:#1E293B;--g2:#334155;--ac:#38BDF8;--tx:#F1F5F9;--mu:#94A3B8;}
html[data-theme="麦田晚风"]{--g0:#FFFBEB;--g1:#FEF3C7;--g2:#FCD34D;--ac:#D97706;--tx:#451A03;--mu:#9CA3AF;}
html[data-theme="莓果初雪"]{--g0:#FFF1F5;--g1:#FFE4EC;--g2:#F9A8D4;--ac:#EC4899;--tx:#4A0A2A;--mu:#9CA3AF;}
html[data-theme="苔藓墨绿"]{--g0:#022C22;--g1:#064E3B;--g2:#10B981;--ac:#34D399;--tx:#ECFDF5;--mu:#6EE7B7;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Noto Sans SC","PingFang SC",sans-serif;}
.card{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--tx);}
.sheet{position:absolute;left:48px;top:150px;width:984px;height:1620px;background:var(--g0);border-radius:24px;padding:48px;display:flex;flex-direction:column;overflow:hidden;}
.top{display:flex;align-items:center;justify-content:space-between;}
.side{font-size:20px;letter-spacing:0.02em;color:var(--tx);}
.night{font-size:20px;letter-spacing:0.02em;color:var(--tx);}
h1.cover{font-size:76px;font-weight:800;line-height:1.3;letter-spacing:0;color:var(--tx);}
h1.cardtitle{font-size:76px;font-weight:800;line-height:1.3;letter-spacing:0;color:var(--tx);}
p.body{font-size:28px;font-weight:500;line-height:1.7;letter-spacing:0;color:var(--tx);}
p.cap{font-size:20px;line-height:1.5;letter-spacing:0.01em;color:var(--tx);}
.well{background:#201a14;padding:12px;border-radius:12px;}
.well img{display:block;width:100%;object-fit:cover;border-radius:4px;}
.panel{background:var(--g1);border-radius:16px;padding:32px;}
.chip{background:var(--g0);border-radius:12px;padding:20px 24px;}
.mark{width:32px;height:32px;background:var(--ac);border-radius:8px;flex:none;}
.ctabar{display:block;width:100%;background:var(--tx);color:var(--g0);text-align:center;font-family:inherit;font-size:30px;font-weight:700;letter-spacing:0.02em;padding:30px 0;border:none;cursor:pointer;border-radius:16px;}
.foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;}
.footword{font-size:20px;letter-spacing:0.01em;color:var(--tx);text-align:right;}
</style>
</head>
<body>
<div class="card" data-od-id="card-root"><div class="sheet" data-od-id="sheet">
<div class="top" data-od-id="top-bar"><span class="side" data-od-id="side-label">深夜树洞</span><span class="night" data-od-id="night-label">母版样张</span></div>
<div style="height:32px;"></div>
<div class="well" data-od-id="masthead-well"><img src="assets/postcard-back.jpg" alt="明信片背面手写字迹" style="height:300px;object-position:50% 28%;"></div>
<div style="height:24px;"></div>
<h1 class="cardtitle" data-od-id="title">三秒钟，练习准时走</h1>
<div style="height:24px;"></div>
<p class="body">有点傻，但真的管用。今晚就试一次。</p>
<div style="height:32px;"></div>
<div class="panel" data-od-id="panel">
<div class="chip" data-od-id="step-1">><p class="body">一，默念三秒，我的下班，我做主。</p></div>
<div style="height:16px;"></div>
<div class="chip" data-od-id="step-2"><p class="body">二，直接站起来收拾包。不解释，不道歉。</p></div>
<div style="height:16px;"></div>
<div class="chip" data-od-id="step-3"><p class="body">三，出门别回头，轻快会追上你。</p></div>
</div>
<div style="height:24px;"></div>
<p class="body" style="text-align:center;">世界不会塌掉，反而轻快不少。</p>
<div style="height:24px;"></div>
<div class="well" data-od-id="stamp-well"><img src="assets/stamp-orange.jpg" alt="橙色国王头像邮票档案照片" style="height:300px;object-position:50% 18%;"></div>
<div class="foot" data-od-id="footer">
<div class="mark" data-od-id="accent-mark"></div>
<div class="footword">情绪树洞 · 母版样张<br><span style="font-size:18px;">橙色邮票档案实拍</span></div>
</div>
</div></div>
</body>
</html>
