<!DOCTYPE html>
<html lang="zh-CN" data-theme="暮色琥珀">
<head>
<meta charset="UTF-8">
<title>情绪树洞 被看见努力，才有安全感</title>
<style>
:root{--g0:#FFF7ED;--g1:#FFEDD5;--g2:#FDBA74;--ac:#EA580C;--tx:#431407;--mu:#9CA3AF;}
html[data-theme="暮色琥珀"]{--g0:#FFF7ED;--g1:#FFEDD5;--g2:#FDBA74;--ac:#EA580C;--tx:#431407;--mu:#9CA3AF;}
html[data-theme="晨雾薄荷"]{--g0:#ECFDF5;--g1:#D1FAE5;--g2:#6EE7B7;--ac:#059669;--tx:#064E3B;--mu:#6B7280;}
html[data-theme="雾蓝海湾"]{--g0:#EFF6FF;--g1:#DBEAFE;--g2:#93C5FD;--ac:#2563EB;--tx:#1E3A8A;--mu:#64748B;}
html[data-theme="玫瑰暮云"]{--g0:#FFF1F2;--g1:#FFE4E6;--g2:#FECDD3;--ac:#E11D48;--tx:#4C0519;--mu:#9CA3AF;}
html[data-theme="森林晨光"]{--g0:#F0FDF4;--g1:#DCFCE7;--g2:#86EFAC;--ac:#16A34A;--tx:#052E16;--mu:#6B7280;}
html[data-theme="海盐汽水"]{--g0:#0D3A57;--g1:#EAF7FF;--g2:#5FB6DE;--ac:#FFD166;--tx:#EAF7FF;--mu:#B8ECD9;}
html[data-theme="雪松深夜"]{--g0:#0F172A;--g1:#1E293B;--g2:#334155;--ac:#38BDF8;--tx:#F1F5F9;--mu:#94A3B8;}
html[data-theme="麦田晚风"]{--g0:#FFFBEB;--g1:#FEF3C7;--g2:#FCD34D;--ac:#D97706;--tx:#451A03;--mu:#9CA3AF;}
html[data-theme="莓果初雪"]{--g0:#FFF1F5;--g1:#FFE4EC;--g2:#F9A8D4;--ac:#EC4899;--tx:#4A0A2A;--mu:#9CA3AF;}
html[data-theme="苔藓墨绿"]{--g0:#022C22;--g1:#064E3B;--g2:#10B981;--ac:#34D399;--tx:#ECFDF5;--mu:#6EE7B7;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Noto Sans SC","PingFang SC",sans-serif;}
.card{width:1080px;height:1440px;position:relative;overflow:hidden;background:var(--tx);}
.sheet{position:absolute;left:48px;top:48px;width:984px;height:1344px;background:var(--g0);border-radius:24px;padding:48px;display:flex;flex-direction:column;overflow:hidden;}
.top{display:flex;align-items:center;justify-content:space-between;}
.night{font-size:20px;color:var(--tx);}
h1.cover{font-size:56px;font-weight:800;line-height:1.15;color:var(--tx);}
h1.cardtitle{font-size:44px;font-weight:700;line-height:1.3;color:var(--tx);}
p.body{font-size:26px;font-weight:400;line-height:1.7;color:var(--tx);}
p.cap{font-size:20px;line-height:1.5;color:var(--tx);}
.well{background:#201a14;padding:12px;border-radius:12px;}
.well img{display:block;width:100%;object-fit:cover;border-radius:4px;}
.band{height:16px;background:var(--ac);border-radius:8px;}
.mark{width:32px;height:32px;background:var(--ac);border-radius:8px;flex:none;}
.stub{background:var(--g1);border-radius:16px;padding:28px 32px;}
.ctabar{display:block;width:100%;background:var(--tx);color:var(--g0);text-align:center;font-family:inherit;font-size:30px;font-weight:700;padding:30px 0;border:none;cursor:pointer;border-radius:16px;}
.foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;}
.footword{font-size:20px;color:var(--tx);text-align:right;}
</style>
</head>
<body>
<div class="card"><div class="sheet">
<div class="top" style="justify-content:flex-end;"><span class="night">上半是夜，下半是你</span></div>
<div style="height:32px;"></div>
<h1 class="cardtitle" data-od-id="insight-title">被看见努力，才有安全感</h1>
<div style="height:24px;"></div>
<div class="well" data-od-id="insight-well"><img src="assets/letter-sara.jpg" alt="1923年手写家书密集字迹" style="height:400px;object-position:50% 68%;"></div>
<div style="height:24px;"></div>
<div class="band" data-od-id="accent-band"></div>
<div style="height:24px;"></div>
<p class="body">心理学里有个说法，叫表现性忠诚。当安全感绑在被看见努力上，离开就等于冒险。</p>
<div style="height:32px;"></div>
<p class="body">可领导真的在看你几点走吗？大多时候，人家只是在忙自己的事。</p>
<div style="height:24px;"></div>
<p class="body">你脑补的那些评判，多半是心里的回声。</p>
<div style="height:24px;"></div>
<p class="cap">不是你懒，是你太会看人脸色了。</p>
<div class="foot" data-od-id="footer">
<div class="mark" data-od-id="footer-mark"></div>
<div class="footword">情绪树洞 · 母版样张<br><span style="font-size:18px;">1923年家书档案实拍</span></div>
</div>
</div></div>
</body>
</html>
